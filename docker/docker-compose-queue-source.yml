services:
    redis:
        image: redis:alpine
        restart: unless-stopped
        dns:
            - 1.1.1.1
            - 8.8.8.8
        volumes:
            - ../files/redis:/data
        networks:
            - flowise-net

    flowise:
        restart: unless-stopped
        dns:
            - 1.1.1.1
            - 8.8.8.8
        build:
            context: .. # Build using the Dockerfile in the root directory
            dockerfile: docker/Dockerfile
            network: host
        volumes:
            - flowise_data:/home/node/.flowise
        environment:
            # --- Essential Flowise Vars ---
            - PORT=${PORT:-3000}
            - DATABASE_PATH=/home/node/.flowise
            - SECRETKEY_PATH=/home/node/.flowise
            - LOG_PATH=/home/node/.flowise/logs
            - BLOB_STORAGE_PATH=/home/node/.flowise/storage
            # --- Queue Vars (Main Instance) ---
            - MODE=queue
            - QUEUE_NAME=flowise-queue # Ensure this matches worker
            - REDIS_URL=redis://redis:6379 # Use service name 'redis'
        depends_on:
            - redis
        networks:
            - flowise-net
        entrypoint: /bin/sh -c "sleep 3; cd /usr/src/flowise/packages/server/bin && ./run start"

    flowise-worker:
        restart: unless-stopped
        dns:
            - 1.1.1.1
            - 8.8.8.8
        build:
            context: .. # Build context is still the root
            dockerfile: docker/worker/Dockerfile # Ensure this path is correct
            network: host
        volumes:
            - flowise_data:/home/node/.flowise
        environment:
            # --- Essential Flowise Vars ---
            - WORKER_PORT=${WORKER_PORT:-5566} # Port for worker healthcheck
            - DATABASE_PATH=/home/node/.flowise
            - SECRETKEY_PATH=/home/node/.flowise
            - LOG_PATH=/home/node/.flowise/logs
            - BLOB_STORAGE_PATH=/home/node/.flowise/storage
            # --- Queue Vars (Main Instance) ---
            - MODE=queue
            - QUEUE_NAME=flowise-queue # Ensure this matches worker
            - REDIS_URL=redis://redis:6379 # Use service name 'redis'
        depends_on:
            - redis
            - flowise
        networks:
            - flowise-net
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:${WORKER_PORT:-5566}/healthz']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

networks:
    flowise-net:
        driver: bridge

volumes:
    flowise_data:
